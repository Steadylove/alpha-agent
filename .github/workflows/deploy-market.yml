name: Deploy Market HTTP

# 推任何分支都重装 VPS 行情服务（Vercel 仍走各自的预览/生产部署）。
# 只重启 nginx，不 rsync CSV。
on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-market
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bundle workers
        run: npm ci && npm run book:worker:bundle && npm run telegram:worker:bundle && npm run option-flow:worker:bundle

      - name: Deploy to VPS
        env:
          HOST: 108.174.50.53
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "缺少 GitHub secret VPS_SSH_KEY" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          rsync -a --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            deploy/market-http/ \
            "root@${HOST}:/var/lib/alpha-agent/market-http-src/"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "root@${HOST}" \
            "bash /var/lib/alpha-agent/market-http-src/deploy.sh"
