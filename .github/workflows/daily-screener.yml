name: Daily Screener Push

on:
  # 自动日更只在 VPS。GitHub 这条只手点。
  workflow_dispatch:

jobs:
  push-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MARKET_DATA_DIR: ${{ github.workspace }}/.market
      HOST: 108.174.50.53
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SCREENER_SKIP_AI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f

      - name: SSH key
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "缺少 GitHub secret VPS_SSH_KEY" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Pull snapshots from VPS
        run: |
          mkdir -p "$MARKET_DATA_DIR/snapshots"
          rsync -a --info=stats1 \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            "root@${HOST}:/var/lib/alpha-agent/market/snapshots/" \
            "$MARKET_DATA_DIR/snapshots/" || true

      - name: Push daily screener images
        run: npm run screener:push

      - name: Push snapshots to VPS
        run: |
          rsync -a --info=stats1 \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            "$MARKET_DATA_DIR/snapshots/" \
            "root@${HOST}:/var/lib/alpha-agent/market/snapshots/"
