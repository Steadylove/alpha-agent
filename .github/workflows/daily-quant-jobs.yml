name: Daily Quant Jobs

on:
  # 日更主定时在 VPS：北京时间周二到周六 08:30。手点这条仍可补跑。
  workflow_dispatch:

concurrency:
  group: daily-quant-jobs
  cancel-in-progress: false

jobs:
  run-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MARKET_DATA_DIR: ${{ github.workspace }}/.market
      OPTION_FLOW_PATH: ${{ github.workspace }}/.review-desk/option-flow.json
      HOST: 108.174.50.53
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      ALPACA_FEED: sip
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: SSH key
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "缺少 GitHub secret VPS_SSH_KEY" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Pull market CSVs from VPS
        run: |
          set -euo pipefail
          mkdir -p "$MARKET_DATA_DIR"
          rsync -a --info=stats1 \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            "root@${HOST}:/var/lib/alpha-agent/market/" \
            "$MARKET_DATA_DIR/"

      - name: Read options flow records
        run: |
          mkdir -p .review-desk
          rsync -a -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            "root@${HOST}:/var/lib/alpha-agent/desk/option-flow.json" "$OPTION_FLOW_PATH"

      - name: Refresh CSV to last session
        run: npm run market:refresh

      - name: Compute snapshots onto VPS files
        continue-on-error: true
        run: npm run jobs:daily

      - name: Build options flow research
        continue-on-error: true
        run: npm run flow:research -- --daily

      - name: Fetch GEX snapshot
        continue-on-error: true
        run: python3 scripts/fetch-gex-snapshot.py

      - name: Copy GEX onto market snapshots
        if: hashFiles('.cache/gex/latest.json') != ''
        run: |
          mkdir -p "$MARKET_DATA_DIR/snapshots"
          cp .cache/gex/latest.json "$MARKET_DATA_DIR/snapshots/gex.json"
          if [ -d .cache/gex/profiles ]; then
            mkdir -p "$MARKET_DATA_DIR/snapshots/gex-profiles"
            cp -a .cache/gex/profiles/. "$MARKET_DATA_DIR/snapshots/gex-profiles/"
          fi

      - name: Push market files to VPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "root@${HOST}" \
            "printf 'updating\\n' > /var/lib/alpha-agent/market/.market-updating"
          rsync -a --info=stats1 --exclude=MANIFEST.json --exclude=.market-updating \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            "$MARKET_DATA_DIR/" \
            "root@${HOST}:/var/lib/alpha-agent/market/"
          rsync -a -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            "$MARKET_DATA_DIR/MANIFEST.json" "root@${HOST}:/var/lib/alpha-agent/market/MANIFEST.json"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "root@${HOST}" \
            "rm -f /var/lib/alpha-agent/market/.market-updating"

      - name: Compute 4H/2H cash books on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "root@${HOST}" \
            "docker exec alpha-book wget -qO- --post-data='' --timeout=600 http://127.0.0.1:8081/live-books"

      - name: Read frozen signals and computed accounts
        run: |
          mkdir -p .review-desk
          rsync -a -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            --include=live-books.json --include=book-versions/ --include='book-versions/*.json' --include=signal-entries/ --include='signal-entries/*.json' --exclude='*' \
            "root@${HOST}:/var/lib/alpha-agent/desk/" .review-desk/

      - name: Build daily review and signal journal
        run: npm run review:build
        env:
          LIVE_BOOKS_PATH: ${{ github.workspace }}/.review-desk/live-books.json
          SIGNAL_JOURNAL_DIR: ${{ github.workspace }}/.review-desk

      - name: Publish daily review snapshots
        run: |
          rsync -a -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            "$MARKET_DATA_DIR/snapshots/daily-review/" "root@${HOST}:/var/lib/alpha-agent/market/snapshots/daily-review/"
          if [ -d "$MARKET_DATA_DIR/review-prices" ]; then
            rsync -a -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
              "$MARKET_DATA_DIR/review-prices/" "root@${HOST}:/var/lib/alpha-agent/market/review-prices/"
          fi

      # Vercel 读 VPS 缓存出图。必须在 VPS 算完之后。
      - name: Push 4H/2H cash books
        run: |
          curl -fsS -m 120 -X POST \
            "${BOOK_PUSH_URL:-https://alpha-agent-eight.vercel.app/api/jobs/push-signal-book}"
        env:
          BOOK_PUSH_URL: ${{ secrets.BOOK_PUSH_URL }}

      - name: Push GEX card
        if: hashFiles('.cache/gex/latest.json') != ''
        run: npx --yes tsx scripts/push-gex-card.ts
        env:
          BOOK_PUSH_URL: ${{ secrets.BOOK_PUSH_URL }}

      - name: Push Tomorrow Map and Options Market Map
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "root@${HOST}" \
            "bash /var/lib/alpha-agent/bin/alpha-review-cards.sh"
