[project]
name = "ibkr-desk"
version = "0.1.0"
description = "A private, lightweight stock and ETF desk for an existing IBKR account"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "ib_async>=2.1,<3", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
