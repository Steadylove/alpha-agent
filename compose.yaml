name: ibkr-desk
services:
  gateway:
    platform: linux/amd64
    image: ${IB_GATEWAY_IMAGE:-ibkr-gateway:local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_DESKTOP_PORT:-6080}:6080"
    volumes:
      - gateway-data:/home/ibgateway
    secrets:
      - gateway_password
    mem_limit: 1536m
    cpus: 1
    pids_limit: 256
    shm_size: 128m
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
  desk:
    platform: linux/amd64
    image: ${DESK_IMAGE:-ibkr-desk:local}
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    env_file: .env
    environment:
      DESK_DB: /data/desk.sqlite3
      IB_HOST: gateway
      IB_PORT: ${IB_GATEWAY_RELAY_PORT:-5001}
    command: ["uvicorn", "desk.app:app", "--host", "0.0.0.0", "--port", "8018", "--workers", "1"]
    ports:
      - "127.0.0.1:${DESK_HTTP_PORT:-8018}:8018"
    volumes:
      - desk-data:/data
    mem_limit: 384m
    cpus: 1
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
volumes:
  desk-data:
  gateway-data:
secrets:
  gateway_password:
    file: ./secrets/gateway-password
