services:
  postgres:
    image: postgres:16-alpine
    container_name: market-compass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: market_compass
      POSTGRES_USER: market_compass
      POSTGRES_PASSWORD: market_compass_dev
    ports:
      - "5432:5432"
    volumes:
      - market_compass_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_compass -d market_compass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  market_compass_postgres:
