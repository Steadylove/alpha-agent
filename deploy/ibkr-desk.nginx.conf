# Nginx HTTP-context configuration; deploy/tls-router.nginx.conf owns public 443.
# Certificate is issued by the existing certbot installation using HTTP-01.
limit_req_zone $binary_remote_addr zone=ibkr_desk_login:1m rate=6r/m;

server {
    listen 80;
    server_name ibkr.192-210-241-6.sslip.io;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/clash-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://ibkr.192-210-241-6.sslip.io$request_uri;
    }
}

server {
    # Retain the previous entry point and redirect it to standard HTTPS.
    listen 8443 ssl;
    # This backend is reachable only from the local TCP router.
    listen 127.0.0.1:9443 ssl proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    if ($server_port = 8443) {
        return 308 https://ibkr.192-210-241-6.sslip.io$request_uri;
    }
    server_name ibkr.192-210-241-6.sslip.io;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/ibkr-desk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ibkr-desk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:IBKRDeskTLS:2m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 16k;
    access_log off;
    error_log /var/log/nginx/ibkr-desk-error.log warn;

    # Overwrite incoming proxy headers; never trust values supplied by clients.
    # Preserve Host for the application's same-origin validation.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 30s;

    location = /api/session {
        limit_req zone=ibkr_desk_login burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8018;
    }
    location / {
        proxy_pass http://127.0.0.1:8018;
    }
}
