# Include from /etc/nginx/nginx.conf at main (not http) scope.
# Requires Ubuntu's libnginx-mod-stream package.
stream {
    map $ssl_preread_server_name $ibkr_tls_backend {
        ibkr.192-210-241-6.sslip.io 127.0.0.1:9443;
        default 127.0.0.1:1443;
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        preread_timeout 10s;
        proxy_pass $ibkr_tls_backend;
        proxy_protocol on;
        proxy_connect_timeout 10s;
        proxy_timeout 1h;
        proxy_socket_keepalive on;
        tcp_nodelay on;
    }
}
